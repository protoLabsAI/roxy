# roxy (deployed) — Portfolio Manager: stock protoAgent + the pm-stack bundle.
# Seeded once to the live config volume (PROTOAGENT_SEED_CONFIG); operator console
# edits then persist and are never clobbered. Most settings inherit protoAgent's code
# defaults — only what roxy needs is set.
identity:
  name: roxy

model:
  provider: openai
  name: protolabs/reasoning
  api_base: http://gateway:4000/v1   # OPENAI_API_KEY (gateway key) from the stack env

# The Portfolio Manager tier (pm-stack): the manager spine. project_board +
# agent_browser are installed-but-off (the teams roxy spins up discover them on this host).
plugins:
  enabled: [delegates, portfolio, github]

# portfolio (ADR 0055) — roxy orchestrates Lead Engineer teams. team_template is the
# base team config she clones per spawn (carries the managed-git `proto` coder, ADR 0076).
# She keeps NO standing team: every team is spun up on demand for an ecosystem repo
# (`portfolio_spinup_team(name, repo)`) and disposed when its board drains. A spawned team
# inherits roxy's own gateway + OPENAI_API_KEY, so no per-team creds prep. (No team_archetypes
# — the old `protocontent` standing preset is gone; protoContent is jon's/matt's domain now.)
portfolio:
  team_template: /opt/roxy/team-template

# github (manager tier): file/triage issues + read PRs/CI across the ECOSYSTEM repos roxy
# owns — the product/runtime line beyond content/design (protoContent → jon/matt; homelab →
# frank). write:true loads the write tools (merge stays confirm-guarded). Bounded by GH_TOKEN
# scope — the token must carry write on these repos for on-demand teams to push.
github:
  write: true
  default_repo: protoLabsAI/protoAgent
  repos:
    - protoLabsAI/protoAgent
    - protoLabsAI/protoLab
    - protoLabsAI/ORBIS

# Delegates (the `delegates` plugin) — the two domain PMs roxy hands domain-specific work to
# (she keeps cross-repo / ecosystem / infra herself). Both are STANDALONE Portfolio Managers
# on the ai net (their own containers), reached by container name; roxy presents each one's own
# inbound token (surfaced in her stack env). They're peers — she routes, they run their teams.
delegates:
  - name: jon
    type: a2a
    url: http://jon:7870/a2a
    auth:
      scheme: bearer
      credentialsEnv: JON_API_KEY
    description: >-
      jon — content Portfolio Manager (peer). Owns the protoContent Payload pipeline (ideas →
      drafts → publications), the locked brand voice, and docs/blog/social. Hand him any
      writing / content / copy / docs need — his content team drafts it into Payload and he
      gates the brand voice. He owns the words; he never merges.
  - name: matt
    type: a2a
    url: http://matt:7870/a2a
    auth:
      scheme: bearer
      credentialsEnv: MATT_A2A_TOKEN
    description: >-
      matt — design/brand Portfolio Manager (peer). Owns the design system (@protolabsai/design
      tokens, @protolabsai/ui component library) and the marketing-site UI on protoLabsAI/
      protoContent, and runs his OWN design/frontend Lead Engineer team. Hand him any design /
      component / theme / a11y need — he scopes it into a brief, builds it through his team, and
      GATES the returned PR on tokens + a11y + DS consistency. He owns the pixels; you own the
      broader ecosystem delivery. He directs + gatekeeps; he never merges.

# roxy is a Portfolio Manager — she orchestrates via portfolio_* tools, she doesn't shell.
# Drop run_command entirely (allow_run:false): headless, there's no operator to answer its
# HITL approval, so any shell call the model attempts stalls the turn forever. Team-side
# shell (readiness/gate/coder) runs inside the spawned team, not here.
filesystem:
  allow_run: false

# Semantic recall ON (fleet-wide default), embeds via the gateway (qwen3-embedding).
knowledge:
  embeddings: true
  embed_model: qwen3-embedding

# A2A agent card (served at /.well-known/agent-card.json) — roxy's PUBLIC fleet identity
# so matt/jon and the console's Fleet ▸ Discover can reach her. The advertised interface
# URL is set at boot from A2A_PUBLIC_URL (stack env → http://ava:7872). require_routable_url
# makes her refuse to start if the card would advertise loopback.
a2a:
  require_routable_url: true
  description: >-
    roxy — Ecosystem Portfolio Manager for protoLabs.studio. Owns cross-repo delivery across
    the wider fleet — the product/runtime repos beyond content and design (protoAgent, protoLab,
    ORBIS), ecosystem features, and infra-adjacent work — and coordinates across the domain PMs.
    She spins up managed-git Lead Engineer teams on demand per project, dispatches features to
    their boards over A2A, rolls up a bounded cross-board view, sequences cross-board
    dependencies, and files/triages the GitHub issues a team can't resolve itself. Content she
    routes to jon, design/brand to matt; anything cross-repo or ecosystem she keeps. She manages
    delivery; she does not write code or merge.
  skills:
    - id: portfolio_orchestration
      name: Portfolio Orchestration
      description: >-
        Dispatch features to the right Lead Engineer team, roll up + diff cross-board
        state, sequence dependencies, and report progress as work merges to done.
      tags: [portfolio, orchestration, delivery, a2a]
      examples:
        - "Ship the trace-export feature on protoAgent."
        - "What's blocked across my teams right now?"
    - id: team_lifecycle
      name: Team Lifecycle
      description: >-
        Spin up a Lead Engineer team for an ecosystem repo on demand, dispatch its work, and
        dispose it once its board drains. She keeps no standing team.
      tags: [teams, spinup, lifecycle]
      examples:
        - "Stand up a team for the ORBIS repo and give it this feature."
    - id: cross_domain_coordination
      name: Cross-Domain Coordination
      description: >-
        Route domain-specific work to the owning PM (content → jon, design/brand → matt),
        sequence cross-repo dependencies between the domains, and keep the shared roadmap moving.
      tags: [coordination, routing, portfolio, a2a]
      examples:
        - "This release needs a blog post and a UI refresh — coordinate jon and matt."
        - "Sequence the ORBIS API change ahead of the work that depends on it."
    - id: issue_triage
      name: Issue Triage
      description: >-
        File and triage GitHub issues for anything a team can't unblock itself — an
        external dependency, a cross-repo ask, a decision that needs a human.
      tags: [github, issues, triage]
      examples:
        - "File an issue for the API change protoAgent is blocked on."
