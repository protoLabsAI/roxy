# Roxy — protoContent Delivery Manager (SHIPPED TEMPLATE).
#
# This is the tracked `.example` that seeds the live config into the config volume on
# first boot (graph/config_io.ensure_live_config). Edit HERE — the untracked
# config/langgraph-config.yaml is a developer's local copy (git- + docker-ignored) and
# never reaches the image.
#
# Roxy takes a build brief (from Matt over A2A, or the operator), hands the actual coding
# to a protoCLI coder confined to a protoContent working clone, and makes sure it lands as
# a REVIEWED PR on protoLabsAI/protoContent. She directs + reports; she never merges.
# See config/SOUL.md for the persona.
#
# Runtime shape: gateway at http://gateway:4000/v1 (OPENAI_API_KEY = gateway key); the
# coder (proto) inherits the container env — gateway key, GH_TOKEN, and the git credential
# rewrite the entrypoint installs — so it branches/commits/pushes and opens the PR itself
# (gh) in /sandbox/work/protoContent (cloned by the entrypoint).

identity:
  name: roxy-protoContent

# Inbound A2A bearer — Matt (and the operator) summon Roxy over A2A (message/send,
# message/stream). Left UNSET on purpose: an empty config token makes the server fall
# back to the A2A_AUTH_TOKEN env (the Infisical ROXY_A2A_TOKEN the stack injects), so the
# real secret isn't shadowed by a baked dev token. Matt reads the same value via
# credentialsEnv:ROXY_A2A_TOKEN. Set a literal token here only for a bare local run.
auth:
  token: ""

# Model — the protolabs LiteLLM gateway. `protolabs/reasoning` is the live alias.
# api_key blank on purpose → falls back to OPENAI_API_KEY (the gateway key, from
# Infisical). Do NOT hardcode the secret here.
model:
  provider: openai
  name: protolabs/reasoning
  api_base: http://gateway:4000/v1
  api_key: ""           # → OPENAI_API_KEY env (from Infisical)
  temperature: 0.2
  max_tokens: 32768
  max_iterations: 50

# Plugins. delegates = the fleet spine (inbound A2A + delegate_to): Roxy's whole roster —
# matt over a2a AND the coder pool as managed-git acp delegates (ADR 0076). coding_agent
# stays enabled as the ACP machinery the acp adapter drives (client cache + permission
# policy), but declares no agents of its own — dispatch goes through delegate_to.
plugins:
  enabled: [delegates, coding_agent]

# delegates (ADR 0025) — Roxy's whole roster, one tool (`delegate_to`):
#
# • matt — the OTHER dev team, over A2A (spec-compliant SendMessage/GetTask). Roxy OWNS
#   coordination: design-system / frontend / a11y / QA work goes to matt (jon's DS
#   engineer + design-critic + component-author, reached through jon's hub proxy on
#   ai_default; auth = jon's operator token, JON_API_KEY env); general building goes to
#   the coder pool below. Fan independent assignments in one turn so they run in parallel.
#
# • proto-1..3 — the CODER POOL: protoCLI (proto) ACP coders for PARALLEL builds, each
#   confined to its OWN linked git worktree of the protoContent clone (wt-1..N,
#   provisioned by the entrypoint: shared .git, isolated working dir + branch).
#   `manage_git: true` (ADR 0076): the FRAMEWORK owns branch/commit/rebase/push/PR — the
#   coder only edits + tests. Branch = `<name>/<slug>-<id7>` (prefix defaults to the
#   delegate name → per-coder namespace, no collisions); base fetched fresh per dispatch;
#   push is remote-SHA-verified; `gh pr create` is idempotent. Dispatch with `item_id` =
#   the work-item id so fan-out dedups (one id → one branch → one PR).
#   `auto` permissions = file+shell authority scoped to that worktree. Keep the pool
#   size == ROXY_CODER_POOL in the stack (default 3). Coding is slow — generous timeouts.
delegates:
  - name: matt
    type: a2a
    url: http://jon:7870/agents/matt-7689/a2a
    auth: { scheme: bearer, credentialsEnv: JON_API_KEY }
    description: >-
      jon's design-system / frontend engineer team (matt + design-critic + component-author).
      Assign him design-system, component, accessibility, theme, and DS-review/QA work — he
      returns a reviewed PR on protoContent or a design-critic verdict. Use him for DS
      expertise + QA; use the coder pool for general building. He's a peer team, not a coder
      I drive tool-by-tool.
  - { name: proto-1, type: acp, command: proto, args: ["--acp"], workdir: /sandbox/work/wt-1,
      permissions: auto, timeout_s: 1200, manage_git: true, base_branch: main,
      description: "Coder 1 of the pool — general protoContent builds; managed git (edits+tests only, framework opens the PR). Pass item_id." }
  - { name: proto-2, type: acp, command: proto, args: ["--acp"], workdir: /sandbox/work/wt-2,
      permissions: auto, timeout_s: 1200, manage_git: true, base_branch: main,
      description: "Coder 2 of the pool — general protoContent builds; managed git (edits+tests only, framework opens the PR). Pass item_id." }
  - { name: proto-3, type: acp, command: proto, args: ["--acp"], workdir: /sandbox/work/wt-3,
      permissions: auto, timeout_s: 1200, manage_git: true, base_branch: main,
      description: "Coder 3 of the pool — general protoContent builds; managed git (edits+tests only, framework opens the PR). Pass item_id." }

# coding_agent (ADR 0024) — kept enabled for the ACP client machinery the acp delegate
# adapter reuses; no agents declared here anymore (the pool lives in `delegates:` above,
# where the managed-git lifecycle applies). Declaring the same coder in both places would
# give it a second, UNmanaged dispatch path (code_with) — don't.
coding_agent:
  default_timeout_s: 900
  agents: []

# filesystem — a READ window onto the same working clone, so Roxy can inspect what the
# coder actually changed (diffs, files) before she reports the PR back. She never writes or
# runs shell herself (allow_run:false → no HITL-gated run_command stalls headless); the
# coder does all the writing, inside coding_agent's confinement.
filesystem:
  enabled: true
  allow_run: false
  projects:
    - { name: protoContent, path: /sandbox/work/protoContent, write: false }

# Subsystems default ON. Memory/knowledge/scheduler/audit all on.
middleware:
  knowledge: true
  audit: true
  memory: true
  scheduler: true

compaction:
  enabled: true
  trigger: "messages:80"
  keep_messages: 20
