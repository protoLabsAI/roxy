# TEAM TEMPLATE for portfolio_spinup_team — roxy's Lead Engineer teams.
#
# Based on the portfolio plugin's shipped example, with ONE deliberate addition:
# the acp coders run under MANAGED GIT (ADR 0076) — the framework owns
# branch/commit/push/PR, the coder only edits files. That kills the failure taxonomy
# a coder-owned git lifecycle produced at pool scale (branch collisions, "edited but
# never pushed", duplicate PRs, stray scratch files).
#
# portfolio_spinup_team clones this dir and fills the per-spawn sentinels:
#     {{REPO}}       → the repo the team's board manages
#     {{TEAM_NAME}}  → the team / board name
# (The pre-PR gate is no longer a per-spawn sentinel: local_gate_cmd is "auto", so the
#  board DISCOVERS the gate from {{REPO}} itself — see project_board.local_gate_cmd below.)
# model.api_base blank → the team INHERITS roxy's gateway (+ her OPENAI_API_KEY via env).

identity:
  name: "{{TEAM_NAME}}"

model:
  provider: openai
  name: protolabs/reasoning
  api_base: ""        # blank → INHERITS roxy's gateway
  api_key: ""         # blank → roxy's OPENAI_API_KEY reaches the team via its environment
  temperature: 0.2

agent_runtime: native

plugins:
  enabled: [delegates, project_board, coder]

# Coding agents the board's loop dispatches to (ACP). manage_git:true (ADR 0076) makes
# the framework mint a deterministic branch off origin/<base_branch>, keep the coder
# edit-only, then commit → rebase → push (--force-with-lease, remote-SHA verified) →
# open the PR idempotently. base_branch = main; branch_prefix namespaces each coder's
# branches so siblings in linked worktrees never collide.
delegates:
  # The escalation ladder climbs gateway MODELS via protocli (proto -m/--model, passed
  # through args) — NOT a second binary. The claude-code ACP coder (claude-agent-acp) is
  # not installed in roxy's image, so a claude tier would fail "agent binary not found".
  # Keep every rung on protocli and climb the model instead: smart → reasoning.
  - { name: proto,           type: acp, command: proto, args: ["--acp", "--model", "protolabs/smart"],     workdir: "{{REPO}}", permissions: auto, manage_git: true, base_branch: main, branch_prefix: proto }
  - { name: proto-reasoning, type: acp, command: proto, args: ["--acp", "--model", "protolabs/reasoning"], workdir: "{{REPO}}", permissions: auto, manage_git: true, base_branch: main, branch_prefix: proto }
  # fusion (ADR 0064 P3) — rung 4, an openai-type completion delegate (can't tool-call,
  # so it's NOT managed-git; the board seam writes its files into a worktree the harness
  # then ships). Blank url → inherits roxy's gateway. api_key does NOT inherit like url
  # does (adapters.py _secret only reads a literal or the api_key_env var) — a blank key
  # sends NO Authorization header and the gateway 401s, blocking every gen that reaches
  # this rung. Point it at OPENAI_API_KEY (roxy's gateway key, present in the team env).
  - { name: fusion, type: openai, model: protolabs/fusion, url: "http://gateway:4000/v1", api_key_env: OPENAI_API_KEY }

project_board:
  repo: "{{REPO}}"            # the repo the board manages; worktrees branch off it
  coders:                     # escalation ladder via protocli, climbing gateway models
    smart: proto              # protocli @ protolabs/smart
    reasoning: proto-reasoning # protocli @ protolabs/reasoning
    opus: proto-reasoning     # protocli @ protolabs/reasoning (no separate opus binary)
  loop_enabled: true          # auto-dispatch ready features
  local_gate_cmd: "auto"      # DISCOVER the pre-PR gate from the repo (package.json
                              # ci/check script → `pnpm run <it>`, Makefile/justfile ci
                              # target, else `pnpm -r --if-present typecheck build test`).
                              # Repo-declared so local == its own CI; never transcribed.
                              # Override with an explicit command; "" = no gate.
  coder_solve_fusion_delegate: fusion
  coder_solve_fusion_k: 2

# coder (ADR 0064) — execution-grounded escalation: greedy → best-of-k → tree-search →
# fusion, gated on the feature's compiled acceptance tests passing (not an LLM judge).
coder:
  delegate: proto

# Fenced filesystem (ADR 0007): the team reads its repo + writes planning/grounding.
filesystem:
  enabled: true
  allow_run: false
  projects:
    - { name: "{{TEAM_NAME}}", path: "{{REPO}}", write: true }
