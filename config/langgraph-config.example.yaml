# Roxy — protoContent Delivery Manager (SHIPPED TEMPLATE).
#
# This is the tracked `.example` that seeds the live config into the config volume on
# first boot (graph/config_io.ensure_live_config). Edit HERE — the untracked
# config/langgraph-config.yaml is a developer's local copy (git- + docker-ignored) and
# never reaches the image.
#
# Roxy takes a build brief (from Matt over A2A, or the operator), hands the actual coding
# to a protoCLI coder confined to a protoContent working clone, and makes sure it lands as
# a REVIEWED PR on protoLabsAI/protoContent. She directs + reports; she never merges.
# See config/SOUL.md for the persona.
#
# Runtime shape: gateway at http://gateway:4000/v1 (OPENAI_API_KEY = gateway key); the
# coder (proto) inherits the container env — gateway key, GH_TOKEN, and the git credential
# rewrite the entrypoint installs — so it branches/commits/pushes and opens the PR itself
# (gh) in /sandbox/work/protoContent (cloned by the entrypoint).

identity:
  name: roxy-protoContent

# Inbound A2A bearer — Matt (and the operator) summon Roxy over A2A (message/send,
# message/stream). Left UNSET on purpose: an empty config token makes the server fall
# back to the A2A_AUTH_TOKEN env (the Infisical ROXY_A2A_TOKEN the stack injects), so the
# real secret isn't shadowed by a baked dev token. Matt reads the same value via
# credentialsEnv:ROXY_A2A_TOKEN. Set a literal token here only for a bare local run.
auth:
  token: ""

# Model — the protolabs LiteLLM gateway. `protolabs/reasoning` is the live alias.
# api_key blank on purpose → falls back to OPENAI_API_KEY (the gateway key, from
# Infisical). Do NOT hardcode the secret here.
model:
  provider: openai
  name: protolabs/reasoning
  api_base: http://gateway:4000/v1
  api_key: ""           # → OPENAI_API_KEY env (from Infisical)
  temperature: 0.2
  max_tokens: 32768
  max_iterations: 50

# Plugins. delegates = the fleet spine (inbound A2A + delegate_to, so Roxy can escalate to
# Matt/operator). coding_agent = the ACP coder (proto) that writes the code. github is
# intentionally NOT enabled — it isn't baked into this fork, and the coder does its own
# git/gh (push + `gh pr create`) from its confined shell, returning the PR URL.
plugins:
  enabled: [delegates, coding_agent]

# coding_agent (ADR 0024) — a POOL of protoCLI (proto) ACP coders for PARALLEL builds.
# Each coder is confined to its OWN linked git worktree of the protoContent clone (wt-1..N,
# provisioned by the entrypoint: shared .git, isolated working dir + branch), so Roxy can
# fan independent build items across them concurrently without collisions — up to the pool
# size (the cap). Each inherits the container env (gateway key for ~/.proto/settings.json,
# GH_TOKEN + git credential rewrite), branches off origin/main per task, and opens its PR.
# `auto` permissions = file+shell authority scoped to that worktree. Keep the agent count ==
# ROXY_CODER_POOL in the stack (default 3). Coding is slow — generous timeouts.
coding_agent:
  default_timeout_s: 900
  agents:
    - { name: proto-1, command: proto, args: ["--acp"], workdir: /sandbox/work/wt-1, permissions: auto, timeout_s: 1200 }
    - { name: proto-2, command: proto, args: ["--acp"], workdir: /sandbox/work/wt-2, permissions: auto, timeout_s: 1200 }
    - { name: proto-3, command: proto, args: ["--acp"], workdir: /sandbox/work/wt-3, permissions: auto, timeout_s: 1200 }

# filesystem — a READ window onto the same working clone, so Roxy can inspect what the
# coder actually changed (diffs, files) before she reports the PR back. She never writes or
# runs shell herself (allow_run:false → no HITL-gated run_command stalls headless); the
# coder does all the writing, inside coding_agent's confinement.
filesystem:
  enabled: true
  allow_run: false
  projects:
    - { name: protoContent, path: /sandbox/work/protoContent, write: false }

# Subsystems default ON. Memory/knowledge/scheduler/audit all on.
middleware:
  knowledge: true
  audit: true
  memory: true
  scheduler: true

compaction:
  enabled: true
  trigger: "messages:80"
  keep_messages: 20
